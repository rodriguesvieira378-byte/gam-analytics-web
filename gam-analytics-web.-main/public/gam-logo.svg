<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-labelledby="title desc">
  <title id="title">GAM Analytics</title>
  <desc id="desc">Escudo tecnológico com gráfico e pulso ao lado do nome GAM Analytics.</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35d8ff"/>
      <stop offset="0.48" stop-color="#00a8ff"/>
      <stop offset="1" stop-color="#2067ff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58e4ff"/>
      <stop offset="1" stop-color="#1676ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(18 10)">
    <circle cx="120" cy="120" r="96" fill="none" stroke="#0b5f9d" stroke-width="2" stroke-dasharray="8 10" opacity="0.55"/>
    <circle cx="120" cy="120" r="79" fill="none" stroke="#0ea9ff" stroke-width="1.4" opacity="0.35"/>
    <path d="M120 16v20M120 204v20M16 120h20M204 120h20" stroke="#22c8ff" stroke-width="3" opacity="0.85"/>
    <path d="M120 36 184 62v48c0 48-23 83-64 109-41-26-64-61-64-109V62z" fill="#07111f" stroke="url(#g1)" stroke-width="8"/>
    <path d="M120 50 170 70v41c0 39-18 68-50 91-32-23-50-52-50-91V70z" fill="none" stroke="#0ea9ff" stroke-width="4" opacity="0.95"/>
    <rect x="87" y="91" width="13" height="44" rx="3" fill="url(#g2)"/>
    <rect x="108" y="76" width="13" height="59" rx="3" fill="url(#g2)"/>
    <rect x="129" y="60" width="13" height="75" rx="3" fill="url(#g2)"/>
    <path d="M73 151h30l7-18 10 37 10-28 7 9h30" fill="none" stroke="#34d9ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

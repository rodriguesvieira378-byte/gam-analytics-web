name: Manter Supabase ativo

# O plano gratuito do Supabase pausa projetos sem uso.
# Este workflow faz uma consulta simples a cada 3 dias para manter o
# projeto ativo. Usa apenas a chave pública (a mesma que já vai no site).

on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://kmsfjyzpxnsgamchweqp.supabase.co' }}
      SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_PB8K9mMhnwHpvLmyxhpjAg_0iVWxHIx' }}

    steps:
      - name: Consultar o banco
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" \
            --retry 3 --retry-delay 20 --max-time 60 \
            "$SUPABASE_URL/rest/v1/officers?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          echo "Resposta HTTP: $status"

          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "Supabase ativo."
          else
            cat response.txt
            echo "::error::O Supabase não respondeu (HTTP $status). Verifique se o projeto foi pausado em supabase.com/dashboard."
            exit 1
          fi
